name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders only. Prisma generation and the unit tests never connect to a database.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit -p .

      - name: Lint
        # Legacy-debt rules are warnings; everything else fails the build.
        run: npx eslint app components lib hooks utils middleware.ts tests --quiet
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Unit tests
        run: npx jest --ci

      - name: Dependency audit
        # Reports known vulnerabilities in production dependencies; high severity fails the job.
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
