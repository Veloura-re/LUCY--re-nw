name: OWASP ZAP Dev Baseline Scan

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  security_scan:
    runs-on: ubuntu-latest
    name: ZAP Baseline Scan
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # TODO: If you map a custom domain to your dev branch (like dev.lucy-re-nw.com), replace this URL!
          target: 'https://lucy-re-nw.vercel.app'
          
          # We set this to false initially so false positives don't block your team from merging code.
          # Once you fix all initial vulnerabilities, set this to true!
          fail_action: false
          
          # Automatically create a GitHub issue if vulnerabilities are found
          allow_issue_writing: true
          issue_title: 'Security Alert: ZAP Dev Baseline Scan'
          
          # Upload the HTML report to GitHub Actions
          artifact_name: 'zap_dev_baseline_report'
